name: dashseller-test

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: dashseller
      POSTGRES_PASSWORD: dashseller
      POSTGRES_DB: dashseller_test
    ports:
      - "54329:5432"
    # Ephemeral by design — every `up` starts from an empty cluster and the
    # test migration runner rebuilds the schema.
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dashseller -d dashseller_test"]
      interval: 2s
      timeout: 3s
      retries: 15
